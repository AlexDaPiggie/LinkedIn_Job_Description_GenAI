[project]
name = "linkedin-job-description-generator"
version = "0.1.0"
description = "LinkedIn Job Description Generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "openai>=1.40.0",
    "huggingface-hub>=0.24.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]