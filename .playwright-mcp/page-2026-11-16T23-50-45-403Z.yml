        - 'heading "How Crowdfunding Works: A Guide for Creators" [level=1] [ref=f8e29]'
        - paragraph [ref=f8e30]: Learn how crowdfunding work, how backers support creative projects, and how to launch and fund your idea with Kickstarter.
        - generic [ref=f8e33]:
          - paragraph [ref=f8e34]:
            - link "Kickstarter" [ref=f8e35] [cursor=pointer]:
              - /url: /author/kickstarter-2/
          - paragraph [ref=f8e36]:
            - time [ref=f8e37]: September 11, 2026
