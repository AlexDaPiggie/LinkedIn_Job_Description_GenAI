                - paragraph [ref=f8e192]: Recurring support
        - paragraph [ref=f8e193]: The best crowdfunding platform depends on what you're trying to fund. Someone raising money for an emergency has different needs from a designer launching a new product or a filmmaker finishing a documentary.
        - paragraph [ref=f8e194]: For creators with a defined creative project, Kickstarter is built specifically to help new ideas find the people who want to bring them to life.
        - heading [level=2] [ref=f8e195]:
          - strong [ref=f8e196]: Why use Kickstarter for crowdfunding?
        - paragraph [ref=f8e197]: Kickstarter has helped bring creative projects to life since 2009. Today, more than 26 million people from around the world have helped fund Kickstarter projects across games, publishing, film, music, art, design, technology, and more.
        - paragraph [ref=f8e198]: Creators also retain 100% ownership of their work. Kickstarter doesn't take equity or ownership in the projects it hosts.
        - paragraph [ref=f8e199]: Projects launched on Kickstarter have gone on to become bestselling books, award-winning films, hit games, innovative products, and successful creative businesses.
        - figure "WeirdCo" [ref=f8e200]:
          - link [ref=f8e201] [cursor=pointer]:
            - /url: https://www.kickstarter.com/projects/cyberpunktcg/the-official-cyberpunk-trading-card-game?ref=updates.kickstarter.com
        - paragraph [ref=f8e203]:
          - text: "But crowdfunding isn't only about blockbuster campaigns. At its core, Kickstarter gives creators a way to ask:"
          - strong [ref=f8e204]: Do enough people want this idea to exist?
        - paragraph [ref=f8e205]: If the answer is yes, those people can help make it possible.
        - paragraph [ref=f8e206]:
          - strong [ref=f8e207]: How do you start a crowdfunding campaign?
        - paragraph [ref=f8e208]:
          - text: "Start by getting clear about three things:"
          - strong [ref=f8e209]: what you're making, how much it will cost, and who will care about it.
        - paragraph [ref=f8e210]:
          - text: From there, you can build your campaign,
          - link "create rewards" [ref=f8e211] [cursor=pointer]:
            - /url: https://updates.kickstarter.com/kickstarter-lessons/reward-strategy/
          - text: ", set a funding goal and timeline, grow your audience, and prepare for launch."
        - paragraph [ref=f8e212]: It's free to start building a project on Kickstarter. If your project is successfully funded, Kickstarter collects a 5% platform fee, plus payment processing fees of roughly 3–5%. If it doesn't reach its goal, no fees are collected.
        - paragraph [ref=f8e213]:
          - link "Visit our Help Center to learn more about fees on Kickstarter →" [ref=f8e214] [cursor=pointer]:
            - /url: https://www.kickstarter.com/help/fees?ref=updates.kickstarter.com
        - paragraph [ref=f8e215]: You don't need to have every detail figured out before you begin. You can start building your project for free and develop your campaign before you're ready to launch.
        - paragraph [ref=f8e216]:
          - strong [ref=f8e217]: Have an idea worth bringing to life?
          - link [ref=f8e218] [cursor=pointer]:
            - /url: https://www.kickstarter.com/creators?ref=nav
            - strong [ref=f8e219]: Start a Kickstarter project →
        - heading [level=2] [ref=f8e220]:
          - strong [ref=f8e221]: Crowdfunding FAQ
        - heading [level=3] [ref=f8e222]:
          - strong [ref=f8e223]: What happens if a Kickstarter doesn't reach its goal?
        - paragraph [ref=f8e224]: Kickstarter uses all-or-nothing funding, so backers are only charged if the project reaches its funding goal by the deadline. If it doesn't, no money changes hands.
        - heading [level=3] [ref=f8e225]:
          - strong [ref=f8e226]: Do you have to pay crowdfunding money back?
        - paragraph [ref=f8e227]: It depends on the type of crowdfunding. Reward-based crowdfunding generally doesn't require repayment like a loan. On Kickstarter, creators don't repay backers or give up equity.
        - heading [level=3] [ref=f8e228]:
          - strong [ref=f8e229]: Do Kickstarter backers own part of a project?
        - paragraph [ref=f8e230]: No. Kickstarter creators retain 100% ownership of their work. Backers may receive rewards, but they don't receive equity or ownership in the project.
        - heading [level=2] [ref=f8e231]:
          - strong [ref=f8e232]: Bring your idea to life
        - paragraph [ref=f8e233]: Crowdfunding gives you a way to find your audience, fund your idea, and bring something new into the world while keeping ownership of your work.
        - paragraph [ref=f8e234]: Ready to get started? Launch your next big idea on Kickstarter.
        - link "Launch a Kickstarter project" [ref=f8e236] [cursor=pointer]:
          - /url: https://www.kickstarter.com/creators?ref=nav
