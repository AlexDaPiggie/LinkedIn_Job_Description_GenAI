      - figure "iStock" [ref=f8e40]:
        - 'img "How Crowdfunding Works: A Guide for Creators" [ref=f8e41]'
      - generic [ref=f8e43]:
        - paragraph [ref=f8e44]:
          - link "Crowdfunding is a way to raise money" [ref=f8e45] [cursor=pointer]:
            - /url: https://help.kickstarter.com/en-us/articles/16236556-what-is-kickstarter?ref=updates.kickstarter.com
          - text: for a project by inviting a large group of people to contribute, usually through an online platform. Instead of relying on a single investor, lender, publisher, or other traditional funding source, creators can go directly to the people who want to see their ideas exist.
        - paragraph [ref=f8e46]: For creators, crowdfunding can do more than provide funding. It can help you test demand, find an audience, build a community around your work, and bring a project to life while maintaining creative ownership.
        - paragraph [ref=f8e47]: Here’s how crowdfunding works and what to know before starting a campaign of your own.
        - heading [level=2] [ref=f8e48]:
          - strong [ref=f8e49]: What is crowdfunding?
        - paragraph [ref=f8e50]: Crowdfunding is a funding model in which many people contribute money to support a project, business, product, cause, or creator.
        - paragraph [ref=f8e51]: "There are four common types of crowdfunding:"
        - paragraph [ref=f8e52]:
          - strong [ref=f8e53]: Reward-based crowdfunding
          - text: lets people pledge money to a project, often in exchange for a reward such as the thing being created, early access, a limited edition, or a unique experience. Kickstarter uses this model.
        - paragraph [ref=f8e54]:
          - strong [ref=f8e55]: Donation-based crowdfunding
          - text: allows people to contribute without expecting anything in return and is often used for personal expenses, emergencies, or charitable causes.
        - paragraph [ref=f8e56]:
          - strong [ref=f8e57]: Equity crowdfunding
          - text: allows people to invest in a company in exchange for an ownership stake.
        - paragraph [ref=f8e58]:
          - strong [ref=f8e59]: Debt crowdfunding
          - text: involves lending money with the expectation of repayment.
        - paragraph [ref=f8e60]: For artists, filmmakers, musicians, writers, designers, game makers, and other independent creators, reward-based crowdfunding offers a way to fund a project without taking out a loan or giving investors ownership of the work.
        - heading [level=2] [ref=f8e61]:
          - strong [ref=f8e62]: How does crowdfunding work?
        - paragraph [ref=f8e63]: Every crowdfunding platform is different, but reward-based crowdfunding generally follows four steps.
        - heading [level=3] [ref=f8e64]:
          - strong [ref=f8e65]: 1. Create your project
        - figure "The Tharpe" [ref=f8e66]:
          - link [ref=f8e67] [cursor=pointer]:
            - /url: https://www.kickstarter.com/projects/thetharpe/the-tharpe-black-music-past-and-present?ref=discover_saved_projects&category_id=361
        - paragraph [ref=f8e69]: Start with a clear idea of what you want to make and how much money you'll need to make it happen.
        - paragraph [ref=f8e70]: Your crowdfunding campaign explains your idea, funding goal, timeline, and how you'll use the money. You can also offer rewards at different pledge levels, from the thing you're creating to limited editions or unique experiences.
        - paragraph [ref=f8e71]:
          - text: Check out our
          - link "Creator Handbook" [ref=f8e72] [cursor=pointer]:
            - /url: https://www.kickstarter.com/help/handbook?ref=updates.kickstarter.com
          - text: for additional resources.
        - heading [level=3] [ref=f8e73]:
          - strong [ref=f8e74]: 2. Backers pledge to your project
        - paragraph [ref=f8e75]:
          - text: Once your campaign goes live, people can
          - strong [ref=f8e76]: back
          - text: it by pledging money toward your funding goal. These supporters are called
          - strong [ref=f8e77]: backers
          - text: .
        - paragraph [ref=f8e78]: On Kickstarter, backers choose how much they want to pledge. They can simply support the project or select a reward offered at a particular pledge level. For example, someone backing a new board game might pledge for a copy of the finished game, while a higher pledge level could include a special edition or additional rewards.
        - paragraph [ref=f8e79]: "Backing isn't the same as investing in a company: backers don't receive equity or ownership in the project. And it isn't quite the same as shopping, either. Backers are helping fund the process of creating something new."
        - paragraph [ref=f8e80]: Creators typically share their campaigns with their existing communities, while Kickstarter also gives them the opportunity to reach people looking to discover and support new creative ideas.
        - figure [ref=f8e81]:
          - 'link "How to Back a Crowdfunding Project on Kickstarter Everything you need to know before and after supporting your first creative project. Kickstarter Blog: Crowdfunding Tips, Stories & Insights •Kickstarter" [ref=f8e82] [cursor=pointer]':
            - /url: https://updates.kickstarter.com/how-to-back-a-crowdfunding-project-on-kickstarter/
            - generic [ref=f8e83]:
              - generic [ref=f8e84]: How to Back a Crowdfunding Project on Kickstarter
              - generic [ref=f8e85]: Everything you need to know before and after supporting your first creative project.
              - generic [ref=f8e86]:
                - generic [ref=f8e87]: "Kickstarter Blog: Crowdfunding Tips, Stories & Insights"
                - generic [ref=f8e88]: •Kickstarter
        - heading [level=3] [ref=f8e90]:
          - strong [ref=f8e91]: 3. Reach your funding goal
        - paragraph [ref=f8e92]:
          - text: Kickstarter uses an
          - link [ref=f8e93] [cursor=pointer]:
            - /url: https://help.kickstarter.com/en-us/articles/16236582-why-is-funding-all-or-nothing?ref=updates.kickstarter.com
            - strong [ref=f8e94]: all-or-nothing funding model
          - text: . If a project reaches its
          - link "funding goal" [ref=f8e95] [cursor=pointer]:
            - /url: https://updates.kickstarter.com/how-to-set-the-right-funding-goal-for-your-kickstarter-campaign/
          - text: by the deadline, backers are charged, and the creator receives the funds, minus applicable fees. If it doesn't reach its goal, no one is charged.
        - paragraph [ref=f8e96]: All-or-nothing funding helps ensure creators have the money they need to deliver what they promised while reducing risk for backers. It can also build momentum as a project gets closer to its goal.
        - paragraph [ref=f8e97]: Projects that reach their goal can continue raising money until the campaign ends.
        - figure "Old Flip Japan" [ref=f8e98]:
          - link [ref=f8e99] [cursor=pointer]:
            - /url: https://www.kickstarter.com/projects/oldflip-japan/vintage-kimono-hoodie/posts/4767998?ref=updates.kickstarter.com
        - heading [level=3] [ref=f8e101]:
          - strong [ref=f8e102]: 4. Bring your project to life
        - paragraph [ref=f8e103]: Once a project is successfully funded, the creator gets to work.
        - paragraph [ref=f8e104]: That might mean manufacturing a product, printing a book, recording an album, finishing a film, developing a game, or producing and shipping rewards. Creators keep backers informed about their progress and work to deliver what they promised.
        - paragraph [ref=f8e105]: That's what makes crowdfunding different from traditional ecommerce. Backers aren't simply buying something already sitting on a shelf. They're helping make something new possible.
        - figure [ref=f8e106]:
          - 'link "From Concept to Fulfillment: The Complete Kickstarter Journey A realistic Kickstarter campaign timeline can help you plan for everything from pre-launch testing and audience building to launch day, backer communication, and what comes next. Kickstarter Blog: Crowdfunding Tips, Stories & Insights •TCF Team" [ref=f8e107] [cursor=pointer]':
            - /url: https://updates.kickstarter.com/from-concept-to-fulfillment-the-complete-kickstarter-journey/
            - generic [ref=f8e108]:
              - generic [ref=f8e109]: "From Concept to Fulfillment: The Complete Kickstarter Journey"
              - generic [ref=f8e110]: A realistic Kickstarter campaign timeline can help you plan for everything from pre-launch testing and audience building to launch day, backer communication, and what comes next.
              - generic [ref=f8e111]:
                - generic [ref=f8e112]: "Kickstarter Blog: Crowdfunding Tips, Stories & Insights"
                - generic [ref=f8e113]: •TCF Team
        - heading [level=2] [ref=f8e115]:
          - strong [ref=f8e116]: What are the pros and cons of crowdfunding?
        - figure "iStock" [ref=f8e117]
        - paragraph [ref=f8e119]: Crowdfunding can offer creators more than access to funding.
        - paragraph [ref=f8e120]:
          - strong [ref=f8e121]: Maintain ownership.
          - text: Kickstarter creators retain 100% ownership of their work. You don't have to give investors equity or repay the funding like a loan.
        - paragraph [ref=f8e122]:
          - strong [ref=f8e123]: Test your idea.
          - text: A campaign can show whether people are willing to support an idea before you invest heavily in producing it.
        - paragraph [ref=f8e124]:
          - strong [ref=f8e125]: Build an audience.
          - text: Crowdfunding can turn early supporters into a community that follows your work, shares your project, and potentially returns for whatever you create next.
        - paragraph [ref=f8e126]:
          - strong [ref=f8e127]: Connect directly with supporters.
          - text: Creators can take an idea directly to the people most likely to care about it rather than relying entirely on traditional gatekeepers.
        - paragraph [ref=f8e128]: Crowdfunding also takes work. A successful campaign requires planning, promotion, communication, and careful budgeting. Even successfully funded projects can encounter production delays, rising costs, and other unexpected challenges.
        - figure [ref=f8e129]:
          - 'link "How to Fund Your Idea: A Complete Guide for Creators Every creative project starts with the same question: How am I going to pay for this? Kickstarter Blog: Crowdfunding Tips, Stories & Insights •Kickstarter" [ref=f8e130] [cursor=pointer]':
            - /url: https://updates.kickstarter.com/how-to-fund-your-idea-a-complete-guide-for-creators/
            - generic [ref=f8e131]:
              - generic [ref=f8e132]: "How to Fund Your Idea: A Complete Guide for Creators"
              - generic [ref=f8e133]: "Every creative project starts with the same question: How am I going to pay for this?"
              - generic [ref=f8e134]:
                - generic [ref=f8e135]: "Kickstarter Blog: Crowdfunding Tips, Stories & Insights"
                - generic [ref=f8e136]: •Kickstarter
        - heading [level=2] [ref=f8e138]:
          - strong [ref=f8e139]: How do crowdfunding platforms compare?
        - paragraph [ref=f8e140]: Different crowdfunding platforms are designed for different goals.
