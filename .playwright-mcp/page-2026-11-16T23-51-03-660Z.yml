        - heading "How do banks move your money?" [level=1] [ref=f22e70]
        - generic [ref=f22e72]:
          - link [ref=f22e75] [cursor=pointer]:
            - /url: /gb/blog/author/lars-trunin/
            - img "Lars Trunin" [ref=f22e77]
          - generic [ref=f22e78]:
            - heading [level=5] [ref=f22e79]:
              - link "Lars Trunin" [ref=f22e80] [cursor=pointer]:
                - /url: /gb/blog/author/lars-trunin/
            - generic [ref=f22e82]:
              - generic [ref=f22e83]: 02.12.19 (updated more than 1 year ago)
              - generic [ref=f22e84]: Read time 12 minutes
    - generic [ref=f22e87]:
      - paragraph [ref=f22e88]: Back in the good old days, if you wanted to buy a goat, you showed up with a few coins, gave them to Betsy and you were done. Since the birth of banking, in addition to getting yourself a nice loan, moving money through the banking system has become simpler and safer, too.
      - paragraph [ref=f22e89]: Have you ever wondered how does your money actually get from one bank to another? Let’s take a few paragraphs to explore this.
      - heading "Intro" [level=3] [ref=f22e90]:
        - link:
          - /url: "#intro"
        - text: Intro
      - paragraph [ref=f22e91]: "Let’s imagine a simple world with only two people – Anna and Carl. Here’s a short summary of what we know about them:"
      - list [ref=f22e92]:
        - listitem [ref=f22e93]: Anna, an awesome engineer, is a customer of Barclays
        - listitem [ref=f22e94]: Carl, an incredible chef, is a customer of NatWest
        - listitem [ref=f22e95]: Anna has 12 coins on her account with Barclays
        - listitem [ref=f22e96]: Carl has 8 coins on his account with NatWest
      - paragraph [ref=f22e97]: "Now to the problem: Anna wants to send 3 coins to Carl using a bank transfer. How does it actually work?"
      - paragraph [ref=f22e98]:
        - img "anna-sends-to-carl-1" [ref=f22e99]
      - paragraph [ref=f22e100]: "Figure 1: Anna wants to send 3 coins to Carl"
      - heading "Basic Bank transfers" [level=2] [ref=f22e101]:
        - link:
          - /url: "#basic-bank-transfers"
        - text: Basic Bank transfers
      - paragraph [ref=f22e102]: There are plenty of ways how banks can do it. The easiest scenario to start with is to imagine a world without any intermediary institutions, such as central banks or payment schemes.
      - paragraph [ref=f22e103]:
        - text: "The key invention here is the following: the same way how Anna and Carl have accounts with Barclays and NatWest, banks can have accounts"
        - emphasis [ref=f22e104]: with each other
        - text: .
      - paragraph [ref=f22e105]:
        - img "anna-sends-to-carl-2" [ref=f22e106]
      - paragraph [ref=f22e107]: "Figure 2: Banks can have accounts with each other"
      - paragraph [ref=f22e108]: "Once this setup is in place, there are a few steps to moving Anna’s coins to Carl’s. Part I:"
      - list [ref=f22e109]:
        - listitem [ref=f22e110]: Barclays notifies NatWest that Anna is making a payment to Carl. This notification can be made through a phone call, an envelope, a telegram etc. – the faster the better.
        - listitem [ref=f22e111]: In parallel, Barclays debits Anna’s account by 3 coins.
        - listitem [ref=f22e112]: In addition, Barclays also marks that they now owe 3 coins to NatWest by marking a -3 for them and +3 for NatWest.
        - listitem [ref=f22e113]: NatWest on the other hand marks also that Barclays (-3) owes them three coins (+3)
        - listitem [ref=f22e114]:
          - text: Because both NatWest and Barclays now know that Anna wishes to send three coins to Carl, and NatWest
          - emphasis [ref=f22e115]: trusts
          - text: that Barclays pays them the difference some time later, they will credit Carl’s account with 3 coins, making the transaction between the two people complete. Barclays now owes 3 coins to NatWest.
      - paragraph [ref=f22e116]:
        - img "anna-sends-to-carl-3" [ref=f22e117]
      - paragraph [ref=f22e118]: "Figure 3: The transaction from Anna to Carl is completed, Barclays now owes 3 coins to NatWest"
      - paragraph [ref=f22e119]: "Whilst Carl can now go and spend his coins, the other half of the transaction has not been completed yet. The real coins are still sitting in Barclays’ vault, and at some point they need to settle this debt. Hence Part II: However way the banks decide to do that it’s really up to them. So let’s imagine that they each send horses to meet in the middle of the road to exchange the accumulated difference in coins, three in this case. And with that, the transaction has been fully completed."
      - paragraph [ref=f22e120]: "There’s even a bit of technical jargon that the banking system uses for the curious:"
      - list [ref=f22e121]:
        - listitem [ref=f22e122]: The process behind Part I is called clearing.
        - listitem [ref=f22e123]: Part II is called settlement.
        - listitem [ref=f22e124]: Barclays would call NatWest’s account with Barclays a Vostro account.
        - listitem [ref=f22e125]: Barclays would call a Barclays’ account with NatWest a Nostro account.
      - paragraph [ref=f22e126]:
        - img "anna-sends-to-carl-4" [ref=f22e127]
      - paragraph [ref=f22e128]: "Figure 4: The basics of correspondent banking"
      - paragraph [ref=f22e129]:
        - text: And what you’ve just seen here is a very basic description of how
        - strong [ref=f22e130]: correspondent banking
        - text: works and how many banks
        - emphasis [ref=f22e131]: (who aren’t connected to Wise, yet)
        - text: send money internationally.
      - paragraph [ref=f22e132]:
        - text: If you bank with Bank A in the UK and want to send money to a bank in Japan, Bank D, there is often a chain of several banks – from A to B to C to D – all of whom have Nostro and Vostro accounts with each other (A with B, B with C, C with D). They then use
        - link "SWIFT" [ref=f22e133] [cursor=pointer]:
          - /url: https://wise.com/gb/blog/everything-you-need-to-know-about-swift-network
        - text: to exchange the clearing messages and use local payment systems to settle the debts between themselves.
      - paragraph [ref=f22e134]: Sometimes the chains can get quite long with many banks in them, and the longer the chain is, the more expensive your cross-border payments will be. Pretty neat right?
      - paragraph [ref=f22e135]: Next we’ll look at how payments within one country (or one currency zone) move.
      - heading "Role of a Central Bank" [level=3] [ref=f22e136]:
        - link:
          - /url: "#role-of-a-central-bank"
        - text: Role of a Central Bank
      - paragraph [ref=f22e137]:
        - text: A Central Bank wears many different hats, one among which is to support commercial banks, such as Barclays or NatWest, to send money between each other. Because the Central Bank almost literally
        - link "defines what money is" [ref=f22e138] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/Money_creation
        - text: ", commercial banks will have accounts with a Central Bank, let’s say Bank of England, the same way how Anna and Carl have an account with Barclays and NatWest."
      - paragraph [ref=f22e139]:
        - img "anna-sends-to-carl-5" [ref=f22e140]
      - paragraph [ref=f22e141]: "Figure 5: Commercial Banks can have accounts with a Central Bank"
      - paragraph [ref=f22e142]:
        - text: This world simplifies the situation for Barclays and NatWest quite a bit. For example, instead of each bank having to have an account with – and that could be quite cumbersome, if you have
        - link "hundreds of banks in each country" [ref=f22e143] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/List_of_banks_in_the_United_Kingdom
        - text: – each bank only has to have one account with Bank of England. Also, NatWest doesn’t have to worry about Barclays eventually paying up the debt.
      - paragraph [ref=f22e144]: "The way how money then moves is quite straightforward:"
      - list [ref=f22e145]:
        - listitem [ref=f22e146]: Anna instructs Barclays to send 3 coins to Carl.
        - listitem [ref=f22e147]: Barclays forwards that instruction to Bank of England
        - listitem [ref=f22e148]: Bank of England checks whether Barclays has at least 3 coins on their account. Once that is confirmed, Bank of England takes 3 coins from Barclays’ account and puts them to NatWest’s account
        - listitem [ref=f22e149]: Bank of England then sends a message to NatWest, indicating that Anna has paid Carl 3 coins
        - listitem [ref=f22e150]: NatWest then gives the coins to Carl
      - paragraph [ref=f22e151]:
        - img "anna-sends-to-carl-6" [ref=f22e152]
      - paragraph [ref=f22e153]: "There are a couple of really good upsides to this system:"
      - list [ref=f22e154]:
        - listitem [ref=f22e155]: Firstly, both the clearing as well as the settlement happen at the same time. This means that NatWest doesn’t have to worry about whether Barclays will actually pay them the 3 coins later. And this happens with every single payment, one-by-one.
        - listitem [ref=f22e156]: Secondly, this system has been set up to work in near real time, so Carl will get the payment from Anna in a matter of minutes.
      - paragraph [ref=f22e157]:
        - text: The system is called Clearing House Automated Payment System or
        - strong [ref=f22e158]: CHAPS
        - text: for short.
      - paragraph [ref=f22e159]: "Despite its clear upsides, CHAPS does come with some downsides:"
      - list [ref=f22e160]:
        - listitem [ref=f22e161]:
          - text: The system is quite expensive. Depending on the bank, a CHAPS payment can cost anywhere from £5 to £25
          - emphasis [ref=f22e162]: per payment
          - text: .
        - listitem [ref=f22e163]: The system works near real time, when it works. However, it only works when the kind people at the Bank of England, who operate CHAPS, are working. In other words, outside working hours, during weekends and bank holidays CHAPS is sleeping and your money won’t move.
      - paragraph [ref=f22e164]: Because of these downsides, CHAPS is mainly used to move really large payments, so you’d use it when you’re buying a house or when you need to move large sums of funds when running a larger corporation.
      - paragraph [ref=f22e165]: If it’s a Saturday afternoon and you need to pay a few pounds to your friend who paid for your saplings that you were planting over the weekend to save the planet (you are doing that, right?), CHAPS in its current form won’t do.
      - paragraph [ref=f22e166]:
        - text: Hence, that’s why other payment schemes exist, such as
        - link "Faster Payments" [ref=f22e167] [cursor=pointer]:
          - /url: https://wise.com/gb/blog/chaps-bacs-swift-faster-payments
        - text: .
      - heading "Role of Payment Schemes" [level=3] [ref=f22e168]:
        - link:
          - /url: "#role-of-payment-schemes"
        - text: Role of Payment Schemes
      - paragraph [ref=f22e169]: "Because CHAPS is expensive to use and works only during certain hours, alternatives have emerged. The introduction of Faster Payments brings the best of both worlds to the game:"
      - list [ref=f22e170]:
        - listitem [ref=f22e171]: Banks like the fact that they don’t have to worry about the other party settling, so let’s stick to trusting Bank of England to handle settlements.
        - listitem [ref=f22e172]: Each transaction to Bank of England (CHAPS) is expensive, so let’s try minimise talking to Bank of England, even if we have millions of transfers going through.
        - listitem [ref=f22e173]:
          - text: The solution is to have Faster Payments handle individual transactions between banks and their customers, while
          - emphasis [ref=f22e174]: netting out
          - text: the total amounts every now and then, and ask the Bank of England to settle the differences in bulk.
      - paragraph [ref=f22e175]:
        - img "anna-sends-to-carl-7" [ref=f22e176]
      - paragraph [ref=f22e177]: "Figure 7: Faster Payments allows banks to send money cheaper and faster"
      - paragraph [ref=f22e178]: "How would it look like for Anna and Carl? Part I:"
      - list [ref=f22e179]:
        - listitem [ref=f22e180]: Anna, as always, sends an instruction to Barclays to send 3 coins to Carl
        - listitem [ref=f22e181]: Barclays now sends the instruction to Faster Payments who immediately forwards it to NatWest.
        - listitem [ref=f22e182]: NatWest in turn credits Carl’s account with 3 coins, ending the clearing process successfully.
      - paragraph [ref=f22e183]:
        - img "anna-sends-to-carl-8" [ref=f22e184]
      - paragraph [ref=f22e185]: "Figure 8: Faster Payments helps banks with clearing payments"
      - paragraph [ref=f22e186]: Part II involves the settlement. In addition to intermediating millions of payments each month, with money moving continuously, several times per day Faster Payments also helps the banks with settling the differences to ensure that everyone is always paid up.
      - paragraph [ref=f22e187]: Faster Payments do so by sending an instruction to Bank of England, indicating which payment institution should be debited and which one should be credited.
      - paragraph [ref=f22e188]:
        - img "anna-sends-to-carl-9" [ref=f22e189]
      - paragraph [ref=f22e190]: "Figure 9: Faster Payments also helps with settling the differences by notifying the Bank of England."
      - paragraph [ref=f22e191]: The real world is a bit messier. For example, banks are required to commit dedicated collateral in Bank of England that helps Faster Payments to ensure that each batch of payments can actually settle and that no bank tries to send out more money than they have available on their Bank of England account.
      - paragraph [ref=f22e192]: The basic principle is exactly how it’s described here, and this clever system of moving money between banks through a payment scheme means that people get 24/7 instant payments at a low price, sometimes even for free.
      - heading "Role of Non-Banks" [level=3] [ref=f22e193]:
        - link:
          - /url: "#role-of-non-banks"
        - text: Role of Non-Banks
      - paragraph [ref=f22e194]: If you’re a user of Wise, then you’ve probably noticed that international transfers are usually significantly more expensive than their domestic counterparts (even if they’re often claimed to be free – watch out for those sneaky rate mark-ups!). We however believe that because money is fundamentally just bits and bites sitting in a Central Bank’s SQL table, kind of how emails are. So if emails are free and instant, and if even domestic transfers can be instant and (almost) free – why couldn’t this be the story for international payments, too?
      - paragraph [ref=f22e195]: This where non-banks come in. Many non-banks, tech companies, fintechs, unicorns – however way you wish to call them – have figured out clever ways to navigate through the web of banking systems to offer noticeably more efficient ways to move money around the world than insofar was possible for consumers and small businesses.
      - paragraph [ref=f22e196]: "In most countries in the world, the story is as it used to be in the UK for Wise back in 2015: the only way for a non-bank to have access to the banking system is to be a customer of a bank. For example, one of the partner banks that Wise works with in the UK is Barclays."
      - paragraph [ref=f22e197]:
        - img "anna-sends-to-carl-10" [ref=f22e198]
      - paragraph [ref=f22e199]: "Figure 10: Wise is a customer of Barclays who is connected to Faster Payments."
      - paragraph [ref=f22e200]: So in order for Anna, now a customer of Wise, to move money to Carl, Wise would then have to instruct Barclays, who instructions Faster Payments, who talks to NatWest, as well as Bank of England, to move three coins to Carl.
      - paragraph [ref=f22e201]: "The benefits are very clear: Anna is now getting a better deal on her international transfer of 3 coins to Carl than she otherwise would have, and Barclays, NatWest, and many banks out there are enabling hundreds of the non-banks deliver these next generation services to millions of consumers and businesses around the world."
      - paragraph [ref=f22e202]: The downsides unfortunately are also quite evident. The more there are players between Anna and Carl, the higher their payment costs are. In addition, if there are technical inefficiencies in any of the players in the chain, Anna’s payment to Carl will be slowed down, no matter who ended up causing the delay.
      - paragraph [ref=f22e203]: Hence, the obvious next step is to ask – how can non-banks get closer to the payment scheme?
      - paragraph [ref=f22e204]: The challenge in most countries doesn’t actually come from the payment schemes, such as Faster Payments. If it were up to them, they probably would have welcomed non-banks to join the circle a long time ago. The crux lies in which institutions can have a settlement account with the Central Bank, e.g. Bank of England. At the moment, almost all countries require these financial institutions to be banks.
      - heading "The Clever Solution" [level=2] [ref=f22e205]:
        - link:
          - /url: "#the-clever-solution"
        - text: The Clever Solution
      - paragraph [ref=f22e206]: In late 2015, Wise stepped into a fruitful partnership with a small UK bank called R. Raphaels & Sons, or Raphaels Bank in short. Together with Raphaels Bank we figured out a clever way to get the best of all worlds – getting Wise closer to Faster Payments while still complying with all the rules.
      - paragraph [ref=f22e207]: "We agreed to the following:"
      - list [ref=f22e208]:
        - listitem [ref=f22e209]: Raphaels Bank will offer a service to Wise where Wise can “borrow” the ability to use Raphaels Bank’s settlement account for moving money between customers
        - listitem [ref=f22e210]: Raphaels Bank becomes a direct participant of Faster Payments, i.e. a full-fledged member
        - listitem [ref=f22e211]: The physical connection to Faster Payments will be built by Wise and operated in conjunction with Raphaels Bank
        - listitem [ref=f22e212]: Wise agree to pay a fee to Raphaels Bank for each payment
      - paragraph [ref=f22e213]: This was a great step closer. It meant that our pipes were set up as if we were a member of Faster Payments, while contractually, legally and from a compliance point of view Raphaels Bank, a bank with a license to go with it, was the member as well as a settlement account holder.
      - paragraph [ref=f22e214]:
        - img "anna-sends-to-carl-11" [ref=f22e215]
      - paragraph [ref=f22e216]: "Figure 11: Wise is now connected to Faster Payments by partnering with Raphaels Bank"
      - paragraph [ref=f22e217]:
        - text: The benefits manifested quite quickly. In addition to seeing a significant reduction in cost, which we were able to pass on as a
        - link "price drop for our customers" [ref=f22e218] [cursor=pointer]:
          - /url: https://wise.com/gb/blog/transferwise-drops-price-from-uk
        - text: ", we saw a surprising improvement in the payment speed. We measured how long it took for customers like Anna to send their GBP deposit to Wise from the moment when they set up a payment until we received their funds. The results were incredible: the speed improved from an average of 15 minutes to about 15 seconds, despite the process being identical for Anna."
      - paragraph [ref=f22e219]:
        - img "payment-speed-before-and-after" [ref=f22e220]
      - paragraph [ref=f22e221]: "Figure 12: Payment speed before and after having a direct connection to Faster Payments"
      - paragraph [ref=f22e222]:
        - text: This clever model has now been turned into an official solution offered by Faster Payments. They’re calling it (with a long name) the
        - link "Directly Connected Non-Settling Participant" [ref=f22e223] [cursor=pointer]:
          - /url: http://www.fasterpayments.org.uk/press-release/new-way-accessing-faster-payments-spreads-true-real-time-247-payments-wider-ever
        - text: model, with the difference that the non-bank could also become a member of the scheme.
      - paragraph [ref=f22e224]: The story looks pretty good for Anna. Except for one tiny, but very important fact – we as a non-bank are still dependent on one additional player in order offer payment services to our customers. If we weren’t, we might not be faster, but we could be a touch more cheaper.
      - paragraph [ref=f22e225]: In addition, with non-banks becoming an increasingly more important type of player in the market for consumer, having all of them be dependent on a limited number of commercial banks can be the cause for a serious systemic risk. And of course it’s very hard for them to secure a good deal due to the limited number of banks willing to offer services to a competitor...
      - paragraph [ref=f22e226]: What can we do about it?
      - heading "Direct Access" [level=3] [ref=f22e227]:
        - link:
          - /url: "#direct-access"
        - text: Direct Access
      - paragraph [ref=f22e228]:
        - text: In July 2017,
        - link "Bank of England announced" [ref=f22e229] [cursor=pointer]:
          - /url: https://www.bankofengland.co.uk/news/2017/july/boe-extends-direct-access-to-rtgs-accounts-to-non-bank-payment-service-providers
        - text: that they are extending access to have an account to non-banks. This was a game changer for companies like Wise because it meant having the ability to move customers’ money without any third parties.
      - paragraph [ref=f22e230]: No time was wasted, we began to work. Since we had told Raphaels Bank of our ultimate wish to be directly connected right from the start, we immediately shared our plans with them, and they became a very helpful partner in order to get us connected as soon as possible.
      - paragraph [ref=f22e231]:
        - text: The work we did together with Raphaels Bank, Faster Payments, Bank of England and many other institutions along the way resulted in Wise becoming the first non-bank to become directly connected both on Faster Payments as well as on Bank of England
        - link "in April 2018" [ref=f22e232] [cursor=pointer]:
          - /url: https://www.ft.com/content/78886740-42e9-11e8-803a-295c97e6fd0b
        - text: .
      - paragraph [ref=f22e233]:
        - img "anna-sends-to-carl-13" [ref=f22e234]
      - paragraph [ref=f22e235]: "Figure 13: Wise is the first non-bank Payment Service Provider to be connected to Faster Payments and Bank of England"
      - paragraph [ref=f22e236]: We have now reached the pen-ultimate level of being able to process Anna’s payments to Carl as closely to the system as possible. The next level would be for the Bank of England to grant non-banks the ability to safeguard their customer funds at the Central Bank overnight, and they’ve shown initial signs of interest(!), but that is a topic for another day.
      - paragraph [ref=f22e237]: That said, the UK is still leading the world when it comes to improving access to one of the fastest growing groups of players in the payments industry, and with that the country is significantly improving the quality of service, speed, price and service resilience for all the Annas out there. It’s, thus, no surprise that the number of direct Faster Payments participants in the UK has exploded in the past several years.
      - paragraph [ref=f22e238]:
        - img "fps-direct-members" [ref=f22e239]
      - paragraph [ref=f22e240]: "Figure 14: FPS Direct Participants in 2015 vs. 2019"
      - paragraph [ref=f22e241]: That’s the story in the UK. What about the rest of the world?
      - heading "The World of Direct Access" [level=3] [ref=f22e242]:
        - link:
          - /url: "#the-world-of-direct-access"
        - text: The World of Direct Access
      - paragraph [ref=f22e243]: "Most countries still have a very long way to in order to claim a victory for their Annas and Carls. For example:"
      - list [ref=f22e244]:
        - listitem [ref=f22e245]: The Eurozone allows for an agency like model, similar to what we had with Raphaels Bank, and isn’t actually that far from granting direct access to non-banks. A key document which requires a bit of clarification is the Settlement Finality Directive, which defines the applicability of the document to financial institutions e.g. banks, but it doesn’t specifically say authorised payment institutions and e-money institutions. This key change would unlock the Eurozone payment systems to take further steps to allow direct access for non-banks.
        - listitem [ref=f22e246]: The United States doesn’t really have a country-wide equivalent for Faster Payments today, but we know that they’re working hard to introduce a great solution in the next decade. However, we have not yet seen much movement in the US considering access to non-banks, which would definitely be a big win for their financial system.
        - listitem [ref=f22e247]: Australia has recently unveiled their New Payments Platform, a system which offers instant clearing and settlement, like CHAPS does, at a price point closer to Faster Payments! However, only banks can access the system directly, and even then the entry barriers are today still quite steep for smaller institutions to consider.
      - paragraph [ref=f22e248]:
        - text: We’re also seeing very interesting solutions and fascinating developments in
        - strong [ref=f22e249]: Switzerland,
        - strong [ref=f22e250]: Hungary
        - text: ","
        - strong [ref=f22e251]: Canada, Malaysia, Japan
        - text: ","
        - strong [ref=f22e252]: Brazil, Hong Kong, Singapore
        - text: and many other countries around the world. And every time we speak to payment schemes, central banks and other interested parties in these regions, we can see and hear genuine hope and excitement, even if getting the change through is sometimes a challenge more difficult than moving a mountain.
