    - generic [ref=f13e156]:
      - heading "The Problem with Partisan Media" [level=2] [ref=f13e158]
      - generic [ref=f13e159]:
        - generic [ref=f13e160]: Over the past decade, online news and ad-driven algorithms have made it profitable for news outlets to embrace a position on the bias spectrum to target specific consumers.
        - generic [ref=f13e162]: Bias in the media affects everything from what events receive coverage, to how a news outlet frames those events in their reporting.As media outlets narrow their perspective and range of coverage, it’s become impossible to consult a single news story for a well-rounded view on important issues.
    - generic [ref=f13e165]:
      - generic [ref=f13e167]:
        - heading "Thinking Freely" [level=2] [ref=f13e168]
        - generic [ref=f13e169]:
          - generic [ref=f13e170]: Ground News was created to offer clarity in an increasingly chaotic media landscape. Our vision is positive coexistence where cooperative, civil debate is the norm, media is accountable, and critical thought is the baseline of our information consumption. We’re on a mission to well inform the world by empowering readers to think freely about the issues of our times.
          - link "Read about our mission here" [ref=f13e171] [cursor=pointer]:
            - /url: /mission
      - generic [ref=f13e175]:
        - heading "A Better Way to Read the News" [level=2] [ref=f13e176]
        - generic [ref=f13e177]: Every day we process nearly 60,000 news articles from over 50,000 different news sources. Articles from different outlets covering the same event are merged into a single story, making it possible to get multiple perspectives in one place.
    - generic [ref=f13e180]:
      - heading "See the Whole Picture" [level=2] [ref=f13e181]
      - paragraph [ref=f13e182]:
        - text: "The Ground News rating system adds context and transparency to every news story. Readers from all walks of life can conveniently identify media bias, check source credibility, and view ownership data for news outlets around the world. The bias and factuality ratings are determined using three independent news monitoring organizations: AllSides, Ad Fontes Media, and Media Bias Fact Check. The ownership categories were researched and developed by Ground News."
        - link "Learn more about our methodology here" [ref=f13e183] [cursor=pointer]:
          - /url: /rating-system
      - generic [ref=f13e186]:
        - generic [ref=f13e187]:
          - generic [ref=f13e188]: Bias
          - generic [ref=f13e189]: What is the political bias of a news outlet? This score takes into account wording, story choices and political affiliation.
        - generic [ref=f13e190]:
          - generic [ref=f13e191]: Factuality
          - generic [ref=f13e192]: How reliable are the reporting practices of the news outlets covering a story? This score takes into account the credibility of sources used, the speed at which corrections are made, and whether the language retains context.
        - generic [ref=f13e193]:
          - generic [ref=f13e194]: Ownership
          - generic [ref=f13e195]: Who owns the news you read? We researched, analyzed and hand-coded ownership data for 2,276 news outlets and counting.
    - generic [ref=f13e197]:
