            - button [expanded] [ref=f13e285] [cursor=pointer]:
              - img "Plus Icon" [ref=f13e287]
          - region "Sukh Singh CTO & Co-Founder" [ref=f13e288]:
            - paragraph [ref=f13e290]: Sukh is a University of Waterloo Nanotechnology Engineering graduate. He launched his first startup through the university’s E-co-op program at age 19, working on solid-phase microextraction technology for medical applications. After gaining experience in sales at Procter & Gamble and R&D at Danaher, Sukh spent three years as a management consultant at Bain & Company where he advised companies in industries spanning telecom, retail, and insurance. Sukh co-founded Ground News with his sister, Harleen Kaur, in 2017. He lives in Kitchener, Ontario with his wife and their daughter.
