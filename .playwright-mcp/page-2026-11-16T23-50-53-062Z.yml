    - generic [ref=f13e232]:
      - generic [ref=f13e233]:
        - heading "Our Team" [level=2] [ref=f13e234]
        - generic [ref=f13e235]:
          - paragraph [ref=f13e236]: Ground News is based in Kitchener, Ontario, in Canada's KW tech corridor. Harleen Kaur and Sukh Singh, siblings with backgrounds in aerospace engineering and nanotech, founded the company in 2017 out of the University of Waterloo's Velocity incubator.
          - paragraph [ref=f13e237]: Supporting them is a team of curious and ambitious employees dedicated to our mission of helping readers better understand the news. They bring a diversity of perspectives, nationalities, and professional experience, including work at Vice, SmartNews, Google, Strava, Spotify, and a range of high-growth startups.
        - link "To see open positions at Ground News, check out our Careers page" [ref=f13e238] [cursor=pointer]:
          - /url: /careers
