      - img "Harleen Kaur and Sukh Singh" [ref=f13e253]
      - generic [ref=f13e255]:
        - generic [ref=f13e256]:
          - heading [level=3] [ref=f13e257]:
            - button "Harleen Kaur CEO & Co-Founder" [expanded] [ref=f13e258] [cursor=pointer]:
              - generic [ref=f13e259]:
                - generic [ref=f13e260]: Harleen Kaur
                - generic [ref=f13e261]: CEO & Co-Founder
            - link "Harleen Kaur on LinkedIn" [ref=f13e262] [cursor=pointer]:
              - /url: https://www.linkedin.com/in/harleenkaurjolly/
              - img "LinkedIn" [ref=f13e263]
            - button [expanded] [ref=f13e267] [cursor=pointer]:
              - img "Plus Icon" [ref=f13e269]
          - region "Harleen Kaur CEO & Co-Founder" [ref=f13e270]:
            - generic [ref=f13e271]:
              - paragraph [ref=f13e272]: With a degree in aerospace engineering, Harleen started her career at NASA where she worked on the Pluto-bound spacecraft New Horizons. She went on to join a startup in Berlin to help build and launch five earth-observation satellites. She was later recruited to Rolls-Royce, where she became the youngest and first female vice president in their jet engine customer business division.
              - paragraph [ref=f13e273]: After working in an area as complex as space itself, Harleen found it strange that we don't have an easy way to find out what's happening on our own planet. In 2017, she co-founded Ground News so readers could better understand how the media ecosystem operates and easily access reliable, diverse coverage for any story without the influence of engagement-maximizing algorithms. She lives in Kitchener, Ontario with her husband and their son.
        - generic [ref=f13e274]:
          - heading [level=3] [ref=f13e275]:
            - button "Sukh Singh CTO & Co-Founder" [expanded] [ref=f13e276] [cursor=pointer]:
              - generic [ref=f13e277]:
