        - generic [ref=f36e46]:
          - generic [ref=f36e47]:
            - generic [ref=f36e48]:
              - 'heading "The Duolingo Method: 5 key principles that make learning fun and effective" [level=1] [ref=f36e49]'
              - paragraph [ref=f36e50]: Fun, effective, driven by science—here’s how Duolingo develops research-based courses.
              - generic [ref=f36e51]:
                - time [ref=f36e53]: February 2, 2023
                - link "Cassie Freeman, Ph.D." [ref=f36e57] [cursor=pointer]:
                  - /url: /author/cassie/
            - img "Illustration of the Duolingo app icon on a phone screen" [ref=f36e59]
          - main [ref=f36e60]:
            - generic [ref=f36e61]:
              - paragraph [ref=f36e62]:
                - text: Duolingo makes learning fun and accessible, but our courses are built on serious learning science! Our teaching methods are grounded in decades of research, and our lessons use national and international standards—so you can be confident that your time is well spent. Here’s how we do it, with the
                - strong [ref=f36e63]: Duolingo Method!
              - heading "What is the Duolingo Method?" [level=2] [ref=f36e64]
              - paragraph [ref=f36e65]:
                - text: We call our approach to teaching and learning with apps the
                - strong [ref=f36e66]: "Duolingo Method:"
                - text: 5 principles that guide how we create new learning content, design engaging lessons, and build courses that are as effective as they are fun! Our learning, product, and design teams have developed this approach by combining research on teaching and learning, our experiences as teachers, and the results of more than a decade studying how our self-guided learners learn best.
              - paragraph [ref=f36e67]:
                - strong [ref=f36e68]: 1. Our courses are interactive, so you learn new skills right from the start.
                - strong [ref=f36e69]: 2. Our courses use AI and learning science to personalize your learning.
                - strong [ref=f36e70]: 3. Our courses teach the most important content and skills.
                - strong [ref=f36e71]: 4. Our courses motivate you to reach your goals.
                - strong [ref=f36e72]: 5. Our courses are designed to entertain and delight.
              - paragraph [ref=f36e73]:
                - img "a visual enumeration of the five elements of the Duolingo Method with Duo in the center. They are 1. Learn by doing. Interactive lessons grounded in learning science help your brain learn. 2. Learn in a personalized way. Lessons adapt to your individual needs so you can learn faster. 3. Focus on what matters. National and international standards inform our curricula so you can learn what matters. 4. Stay motivated. Bite-sized lessons and gamification features help you make learning a habit. 5. Feel the delight. Delightful experiences bring you joy and help build you confidence." [ref=f36e74]
              - heading "Our courses are interactive, so you learn new skills right from the start." [level=2] [ref=f36e75]
              - heading "💡 Learn by doing" [level=5] [ref=f36e76]
              - paragraph [ref=f36e77]: In every Duolingo lesson, you’ll work through interactive lessons that put you at the center of your own learning. We naturally pick up on patterns around us, even if we don’t realize it—it’s just how our brains are built! Duolingo leverages this natural ability with lessons that draw learners’ attention to important patterns, from verb conjugations, to spelling rules, to creating fractions, to cement those patterns in your brain!
              - paragraph [ref=f36e78]:
                - strong [ref=f36e79]: "What this means for you:"
                - text: When you start a lesson on Duolingo, you dive right into what you want to learn. 💪 The exercises and exact content are tailored so you start with simpler material in easier exercises—to get you noticing those patterns—and then lead you through more challenging examples so you can apply what you’ve learned to new contexts. We also build in features to help keep you on the right track, like optional hints and bite-sized explanations.
              - paragraph:
                - img
              - heading "Our courses use AI and learning science to personalize your learning." [level=2] [ref=f36e80]
              - heading "💡 Learn in a personalized way" [level=5] [ref=f36e81]
              - paragraph [ref=f36e82]:
                - text: Personalized lessons help you learn at your own pace and (cool tech alert!) they adapt to your strengths and weaknesses as you progress through your course. Our
                - link "AI model" [ref=f36e83] [cursor=pointer]:
                  - /url: https://blog.duolingo.com/learning-how-to-help-you-learn-introducing-birdbrain/
                - text: tracks what you learn and adjusts the order and difficulty of the exercises you see so that you’re always seeing a balance of familiar and more challenging content. Research shows that giving you just the right level of difficulty—right at the edge of what you know, pushing you toward developing new skills—leads to more engagement and better learning! We also use algorithms to create unique practice sessions that help you strengthen the skills where you could use the most help.
              - paragraph [ref=f36e84]:
                - strong [ref=f36e85]: "What this means for you:"
                - text: Your Duolingo course is unique to YOU! 🎁 The exercises you see get more advanced for the concepts you’ve aced (you’re ready for the challenge!), and you’ll see more foundational practice for content you need to review. This combination of AI and learning science gets you to the edge of your learning so that you’re constantly building new skills and rising to new challenges!
              - heading "Our courses teach the most important content and skills." [level=2] [ref=f36e86]
              - heading "💡 Focus on what matters" [level=5] [ref=f36e87]
              - paragraph [ref=f36e88]:
                - text: Duolingo courses teach the most important information, the content you really need to know—we want you to develop nimble skills that will serve you well, no matter where you take your new skills! That’s why we use
                - link "national" [ref=f36e89] [cursor=pointer]:
                  - /url: https://www.thecorestandards.org/?ref=blog.duolingo.com
                - text: and
                - link "international" [ref=f36e90] [cursor=pointer]:
                  - /url: https://www.coe.int/en/web/common-european-framework-reference-languages/level-descriptions?ref=blog.duolingo.com
                - text: standards to guide decisions about what we include in your course. We then complement these documented standards with our learning experts’ experience to develop well-rounded courses that give you a strong foundation and all the tools to take your learning out into the world!
              - paragraph [ref=f36e91]:
                - strong [ref=f36e92]: "What this means for you:"
                - text: You can trust that your Duolingo course is using research-backed standards that have been tested for decades, so the content you’re learning focuses on the most valuable topics. 🧠 Since schools and institutes also rely on these standards, you can easily describe your learning and progress to people around the world!
              - heading "Our courses motivate you to reach your goals." [level=2] [ref=f36e93]
              - heading "💡 Stay motivated" [level=5] [ref=f36e94]
              - paragraph [ref=f36e95]:
                - text: The whole Duolingo experience is designed to help you stick with your learning, for the long-term! It’s easy to fit in study time with our bite-sized lessons that take just a few minutes to complete. And the gamification that’s built into each course keeps you
                - emphasis [ref=f36e96]: wanting
                - text: "to return: Completing lessons earns you points and extends your learning streak, and you’ll find lots of opportunities to partner with (and compete against!) friends. These tools help you feel accomplished and motivated to reach your goals—and research shows they help keep you engaged and learning better, too!"
              - paragraph [ref=f36e97]:
                - strong [ref=f36e98]: "What this means for you:"
                - text: You bring your interest in learning, and Duolingo will take care of the rest! 👯‍♀️ Your study time will fly by as you rack up points, compete with learners around the world, and collect rounds of virtual high fives from your friends as you pass big milestones. All these tools help keep you motivated, and you might be surprised that learning can be this much fun!
              - paragraph:
                - img "three screens demonstrating how duolingo’s apps support streaks. The first screen is from the language app and shows a flaming number five with the words 5 day streak. Underneath it has the days of the week Sunday through Saturday with check marks for the first five days. It also explains “A streak counts how many days you’ve practiced in a row.” A continue button is at the bottom. The second screen is from Duolingo ABC and shows the first part of a daily joke. Fofo is asking a young Bea “What do you call a boomerang that won’t come back?” A right pointing arrow is at the bottom. The third screen is from the math app and shows a flame with a 5 next to it in the upper right hand corner of the screen. In the center of the screen it reads “Streak extended” and shows a flaming Duo in cube form, wearing sunglasses. A continue button is at the bottom."
              - heading "Our courses are designed to entertain and delight." [level=2] [ref=f36e99]
              - heading "💡 Feel the delight" [level=5] [ref=f36e100]
              - paragraph [ref=f36e101]:
                - text: Learning with Duolingo is a blast! We know people learn better when they have joyful experiences, so we build light-hearted learning into every course and lesson. Our cheerful characters, with their own personalities and backstories, show up throughout your course and make the learning experience more interesting and meaningful. You’ll also find encouraging words and supportive messages from Duo the owl! And this fun spirit is in the lessons, too, because
                - link "funny content sticks with you" [ref=f36e102] [cursor=pointer]:
                  - /url: https://blog.duolingo.com/how-silly-sentences-can-help-you-learn/
                - text: and makes learning more memorable.
              - paragraph [ref=f36e103]:
                - strong [ref=f36e104]: "What this means for you:"
                - text: Your Duolingo lessons are filled with warmth, color, and—yes—a little sass! 😊 While you’re learning new content, you’ll also be uncovering more about the silly and sweet personalities of our family of characters. They’ll cheer you on between exercises, celebrate your accomplishments, and become your pals on a learning journey like no other.
              - heading "Learning with Duolingo is free, fun, and effective!" [level=2] [ref=f36e105]
              - paragraph [ref=f36e106]:
                - text: The Duolingo Method is how we make sure that our apps are effective and fun! These guidelines help us create
                - link "learning experiences that really work" [ref=f36e107] [cursor=pointer]:
                  - /url: https://duolingo.com/efficacy?ref=blog.duolingo.com
                - text: and bring high-quality education tools to learners around the world.
              - paragraph [ref=f36e108]:
                - text: To get started on your own learning journey, download Duolingo for language learning (on
                - link "iOS" [ref=f36e109] [cursor=pointer]:
                  - /url: https://apps.apple.com/us/app/duolingo-language-lessons/id570060128?ref=blog.duolingo.com
                - text: ","
                - link "Android" [ref=f36e110] [cursor=pointer]:
                  - /url: https://play.google.com/store/apps/details?id=com.duolingo&hl=en_US&gl=US&pli=1&ref=blog.duolingo.com
                - text: ", and"
                - link "web" [ref=f36e111] [cursor=pointer]:
                  - /url: https://www.duolingo.com/?ref=blog.duolingo.com
                - text: ), Duolingo ABC for reading and literacy (on
                - link "iOS" [ref=f36e112] [cursor=pointer]:
                  - /url: https://apps.apple.com/app/apple-store/id1440502568?pt=1374442&ct=Web%20splash&mt=8&ref=blog.duolingo.com
                - text: and
                - link "Android" [ref=f36e113] [cursor=pointer]:
                  - /url: https://play.google.com/store/apps/details?id=com.duolingo.literacy&ref=blog.duolingo.com
                - text: ), and Duolingo Math for elementary math and brain training (on
                - link "iOS" [ref=f36e114] [cursor=pointer]:
                  - /url: https://itunes.apple.com/us/app/duolingo/id1598161822?ref=blog.duolingo.com
                - text: ).
              - paragraph [ref=f36e115]:
                - emphasis [ref=f36e116]:
                  - link "Click here" [ref=f36e117] [cursor=pointer]:
                    - /url: https://duolingo-papers.s3.amazonaws.com/reports/duolingo-method-whitepaper.pdf?ref=blog.duolingo.com
                  - text: to read more about the science behind the Duolingo Method, or watch our 2023 Duocon talk below!
