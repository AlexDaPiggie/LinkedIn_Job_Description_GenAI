          - generic [ref=f26e20]:
            - heading "Collect the facts" [level=3] [ref=f26e21]
            - paragraph [ref=f26e22]: Guided questions, or upload an old job description and let it fill them in. Pay range is optional and typed by you.
          - paragraph [ref=f26e23]: in role notes or a fileout structured answers
        - listitem [ref=f26e24]:
