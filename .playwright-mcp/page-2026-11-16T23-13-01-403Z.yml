          - generic [ref=f26e32]:
            - heading "Check the structure" [level=3] [ref=f26e33]
            - paragraph [ref=f26e34]: The JSON is checked against a schema. If it is cut off or malformed, it is retried once, then reported as an error.
          - paragraph [ref=f26e35]: in JSON draftout valid draft or retry
