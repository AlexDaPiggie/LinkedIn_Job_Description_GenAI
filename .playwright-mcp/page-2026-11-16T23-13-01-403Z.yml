      - generic [ref=f26e50]:
        - generic [ref=f26e51]:
          - heading "Free, no account" [level=3] [ref=f26e52]
          - list [ref=f26e53]:
            - listitem [ref=f26e54]: Generate a full draft
            - listitem [ref=f26e55]: Upload and auto-fill from an old job description
            - listitem [ref=f26e56]: Quality check, quick edits, section rewrite, undo
            - listitem [ref=f26e57]: Copy to LinkedIn, Word export, screening questions
        - generic [ref=f26e58]:
          - heading "1 credit" [level=3] [ref=f26e59]
          - list [ref=f26e60]:
            - listitem [ref=f26e61]: A refine request you type yourself
            - listitem [ref=f26e62]: New accounts get 20 free credits
            - listitem [ref=f26e63]: If the AI call fails, the credit is returned automatically
            - listitem [ref=f26e64]: "More credits: $5 for 20, $10 for 40, $20 for 80"
    - region "Design choices" [ref=f26e65]:
      - heading "Design choices" [level=2] [ref=f26e66]
      - list [ref=f26e67]:
        - listitem [ref=f26e68]:
          - generic [ref=f26e69]: Pay numbers
          - generic [ref=f26e70]:
            - heading "Never written by the AI" [level=3] [ref=f26e71]
            - paragraph [ref=f26e72]: Your range is formatted by code and attached after generation, so the model cannot invent or change it.
        - listitem [ref=f26e73]:
          - generic [ref=f26e74]: Quality rules
          - generic [ref=f26e75]:
            - heading "Plain rules, no extra AI cost" [level=3] [ref=f26e76]
            - paragraph [ref=f26e77]: Word lists from published research on gendered and age-coded job ads. A screening aid, not proof of bias.
        - listitem [ref=f26e78]:
          - generic [ref=f26e79]: Verify marks
          - generic [ref=f26e80]:
            - heading "Added requirements are flagged" [level=3] [ref=f26e81]
            - paragraph [ref=f26e82]: Requirements that share no words with your answers are marked, so you can check or remove them.
        - listitem [ref=f26e83]:
          - generic [ref=f26e84]: Uploads
          - generic [ref=f26e85]:
            - heading "Treated as untrusted text" [level=3] [ref=f26e86]
            - paragraph [ref=f26e87]: File text is cleaned, capped and wrapped in delimiters, and extracted fields are filtered to known names and types.
    - region "Money and safety" [ref=f26e88]:
      - heading "Money and safety" [level=2] [ref=f26e89]
      - list [ref=f26e90]:
        - listitem [ref=f26e91]:
          - generic [ref=f26e92]: Credit ledger
          - generic [ref=f26e93]:
            - heading "One step, never twice" [level=3] [ref=f26e94]
            - paragraph [ref=f26e95]: One database function checks and subtracts credits in a single step. Each charge has a unique key, so a repeated request never charges twice.
        - listitem [ref=f26e96]:
          - generic [ref=f26e97]: Payments
          - generic [ref=f26e98]:
            - heading "Prices set on the server" [level=3] [ref=f26e99]
            - paragraph [ref=f26e100]: Stripe Checkout with a fixed pack list. Webhooks are verified and credit once per checkout session, and failed attempts are retried by Stripe.
        - listitem [ref=f26e101]:
          - generic [ref=f26e102]: Free endpoint
          - generic [ref=f26e103]:
            - heading "Bot check and limits" [level=3] [ref=f26e104]
            - paragraph [ref=f26e105]: Cloudflare Turnstile, a per-IP daily limit that reads the address only from trusted proxies, and a global daily cap as a kill switch.
        - listitem [ref=f26e106]:
          - generic [ref=f26e107]: Signup
          - generic [ref=f26e108]:
            - heading "One free grant per mailbox" [level=3] [ref=f26e109]
            - paragraph [ref=f26e110]: Email must be confirmed first. Gmail dots and plus tags are collapsed, and throwaway email domains are blocked.
    - region "Stack" [ref=f26e111]:
      - heading "Stack" [level=2] [ref=f26e112]
      - paragraph [ref=f26e113]:
        - text: Vanilla JavaScript front end, FastAPI back end, Supabase for sign-in and data, Stripe Checkout for payments, OpenRouter for model access, hosted on Hugging Face Spaces. The quality rules live in
        - code [ref=f26e114]: src/quality
        - text: and run without the rest of the app. See
        - link "how the model was chosen" [ref=f26e115] [cursor=pointer]:
