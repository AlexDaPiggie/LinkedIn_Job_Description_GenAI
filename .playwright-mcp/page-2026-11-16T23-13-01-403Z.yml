      - paragraph [ref=f26e13]: "A short pipeline: collect facts, ask the AI for structured output, validate it, check it with plain rules, then show it. The AI never writes pay numbers, and every edit is saved so you can undo it."
      - paragraph [ref=f26e14]: 5 steps - 1 model call per draft - 0 extra AI calls for the quality check
