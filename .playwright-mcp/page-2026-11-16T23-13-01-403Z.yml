          - generic [ref=f26e26]:
            - heading "Ask the AI for structured output" [level=3] [ref=f26e27]
            - paragraph [ref=f26e28]: Fixed instructions come first and your data last, wrapped as data rather than commands. The model returns JSON, not free text.
          - paragraph [ref=f26e29]: in answers + instructionsout JSON draft
        - listitem [ref=f26e30]:
