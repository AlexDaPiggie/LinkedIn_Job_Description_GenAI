name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 UTC every 4 days
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows manual testing from the GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # Strip trailing slash from URL if present
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          
          echo "Pinging Supabase at $URL..."
          curl -f -s -S -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -X GET "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"